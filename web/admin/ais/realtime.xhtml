<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:ui="http://java.sun.com/jsf/facelets"
  xmlns:p="http://primefaces.org/ui"
>
  <h:head>
    <title>Sismar - Real time</title>

    <ui:include src="/admin/components/headdefault.xhtml" />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.datatables.net/1.10.19/css/jquery.dataTables.css"
    />
    <script
      type="text/javascript"
      charset="utf8"
      src="https://cdn.datatables.net/1.10.19/js/jquery.dataTables.js"
    ></script>
    <script type="text/javascript" src="https://unpkg.com/togeojson"></script>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.control.layers.tree/L.Control.Layers.Tree.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.fullscreen@3.0.2/Control.FullScreen.css"
    />

    <style>
      #map {
        width: 100%;
        height: 100%;
      }

      .leaflet_label {
        text-shadow: 1px 0 0 #fff, -1px 0 0 #fff, 0 1px 0 #fff, 0 -1px 0 #fff,
          1px 1px #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
        border: none;
        background: transparent;
        box-shadow: none;
        margin: 0px;
        font-size: 10px !important;
      }

      .leaflet_label:before,
      .leaflet_label_weather:before {
        border-right-color: transparent !important;
        border-left-color: transparent !important;
      }

      .icon-weather > img {
        width: 100px;
      }

      .leaflet_label_weather {
        text-shadow: 1px 0 0 #fff, -1px 0 0 #fff, 0 1px 0 #fff, 0 -1px 0 #fff,
          1px 1px #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
        border: none;
        background: transparent;
        box-shadow: none;
        margin: 0px;
        font-size: 10px !important;
      }

      .leaflet_label_weather {
        margin-left: 10px !important;
        line-height: 12px;
        margin-top: 3px;
      }

      .leaflet_label_more_vessel {
        margin-top: 10px !important;
      }

      .leaflet_popup_weather > div > div.leaflet-popup-content {
        height: 190px !important;
        width: 340px !important;
        margin: 13px !important;
      }

      .leaflet_popup_weather > div > div.leaflet-popup-content > div {
        width: 340px !important;
      }

      .leaflet_popup_loading > div > div.leaflet-popup-content {
        height: 20px !important;
      }

      .leaflet_popup_info_vessel > div > div.leaflet-popup-content {
        height: 503px !important;
        width: 436px !important;
        margin: -1px !important;
      }

      .container-popup-vessel > .row {
        margin: 0px;
      }

      .container-popup-vessel {
        width: 436px;
        background: #ffffff !important;
        border-radius: 10px !important;
      }

      .container-popup-img {
        height: 200px;
        padding: 0px;
      }

      .container-popup-info {
        margin-top: 10px !important;
      }

      .container-popup-info {
        font-size: 13px !important;
        line-height: 1;
      }

      .container-popup-info-card-title {
        font-weight: bold;
      }

      .container-popup-title {
        background-color: #222d32;
        color: #ffffff;
        line-height: 0.2;
        border-top-left-radius: 10px !important;
        border-top-right-radius: 10px !important;
      }

      .container-popup-name {
        font-size: 16px;
        font-weight: bold;
        margin-top: 15px;
        line-height: 1;
      }

      .container-popup-type {
        font-size: 12px;
        padding-bottom: 5px;
      }

      .container-popup-footer {
        background-color: #f9f9f9;
        font-size: 12px;
        line-height: 0.2;
        border-bottom-left-radius: 10px !important;
        border-bottom-right-radius: 10px !important;
        margin-top: 15px;
        padding-top: 15px;
      }

      .container-popup-info
        > div.row:nth-child(1)
        > div.container-popup-info-card {
        border-right: 1px solid #efefef;
      }

      .container-popup-info
        > div.row:nth-child(2)
        > div.container-popup-info-card {
        border-right: 1px solid #efefef;
      }

      .container-popup-info
        > div.row:nth-child(1)
        > div.container-popup-info-card:last-child {
        border-right: none !important;
      }

      .container-popup-info
        > div.row:nth-child(2)
        > div.container-popup-info-card:last-child {
        border-right: none !important;
      }

      .container-popup-info > div.row:nth-child(1) {
        border-bottom: 1px solid #efefef;
        padding-bottom: 10px;
      }

      .container-popup-info > div.row:nth-child(2) {
        padding-top: 10px;
      }

      .container-popup-info > div.row {
        margin-right: 0px !important;
        margin-left: 0px !important;
      }

      .leaflet-tooltip {
        font-size: 14px; /* aumenta o tamanho da fonte */
        color: #000000; /* cor do texto */
      }

      /* fundo do controle */
      .leaflet-control-layers {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border-radius: 8px;
        font-family: Arial, sans-serif;
        font-size: 13px;
      }

      /* títulos de seção */
      .leaflet-layerstree-header-title {
        font-weight: bold;
        font-size: 15px;
        color: #4cafef;
      }

      /* estiliza os labels (itens) */
      .leaflet-layerstree-label {
        font-weight: normal; /* itens normais */
        display: flex; /* alinha checkbox + texto */
        align-items: center;
        cursor: pointer;
      }

      .leaflet-layerstree-header-name {
        font-weight: normal;
        padding-left: 10px;
        font-size: 13px;
      }
    </style>
  </h:head>

  <h:body>
    <div class="container-fluid" style="padding: 0px">
      <!-- Importar menu -->
      <ui:include src="/admin/components/menu.xhtml" />

      <!-- Importar header -->
      <ui:include src="/admin/components/header.xhtml" />

      <div id="content-map">
        <div id="map" class="map-ais-information-invisible">
          <!-- Importar informacoes embarcacao -->
          <ui:include src="/admin/components/vesselinfoais.xhtml" />

          <!-- Importar tela de propriedades -->
          <ui:include src="/admin/components/mapproperties.xhtml" />

          <!-- Importar meteorologia -->
          <ui:include src="/admin/components/meteorologiaais.xhtml" />
        </div>
      </div>

      <!-- Importar rodapé -->
      <ui:include src="/admin/components/footer.xhtml" />
    </div>

    <!-- Importar atracacao -->
    <ui:include src="/admin/components/atracacao.xhtml" />

    <h:form id="update-vessels">
      <p:poll
        widgetVar="wvPoll"
        autoStart="false"
        listener="#{AisBean.updateVessels(null)}"
        interval="#{AisBean.delay}"
      >
      </p:poll>
    </h:form>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script
      src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
    ></script>
    <script
      src="https://unpkg.com/leaflet.control.layers.tree/L.Control.Layers.Tree.js"
    ></script>
    <script
      src="https://unpkg.com/leaflet.fullscreen@3.0.2/Control.FullScreen.js"
    ></script>

    <h:outputScript name="js/menu.js" target="body" />
    <h:outputScript name="js/jquery.cookie.js" target="body" />
    <h:outputScript name="js/moment.min.js" target="body" />
    <h:outputScript name="js/atracacao.js" target="body" />

    <script type="module">
      import AisMap from "#{resource['js/sismar.ais.realtime.js']}";
      import MeteorologiaAis from "#{resource['js/meteorologiaais.js']}";
      import VesselInfoAis from "#{resource['js/vesselinfoais.js']}";

      const url = "/sismar";
      //const url = "https://sismarapp.com.br/sismar";      

      const meteorologia = new MeteorologiaAis({
        apiUrl: url,
      });

      const ais = new AisMap({
        containerId: "map",
        apiUrl: url,
        onReady: () => {
            ais.refreshAndProcess();
            $(function(){ PF('wvPoll').start(); });
            meteorologia.init("#meteorologiaais-main", ais);
        },
      });

      ais.init();

      const vesselInfo = new VesselInfoAis({
        containerId: "#vesselinfoais-main",
        apiUrl: url,
      });

      ais.setModalVesselInfo(vesselInfo);

      // expõe no global
      window.ais = ais;
    </script>
  </h:body>
</html>
